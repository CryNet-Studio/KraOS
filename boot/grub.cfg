set timeout=0
set default=0
# P1 内核只往串口写，gfxterm 在 -vga std 下会抢走画面，这里以 serial 为主。
# 必须先跑 serial 命令真正把串口终端初始化出来，否则 terminal_output serial
# 静默失效 —— GRUB 自己的一切输出（含 multiboot2 的加载错误）就只剩 VGA。
serial --unit=0 --speed=115200
terminal_output serial console
terminal_input serial console
menuentry "KraOS Kernel (Kotlin/Native)" {
    multiboot2 /boot/kernel.elf
    boot
}
